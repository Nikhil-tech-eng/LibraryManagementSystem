apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: borrowing-to-user-latency
  namespace: chaos-testing
  labels:
    app.kubernetes.io/part-of: lms
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      "app": "borrowing-service"
  delay:
    latency: "500ms"
    correlation: "25"
    jitter: "50ms"
  direction: egress
  externalTargets:
    - "user-svc.default.svc.cluster.local"
  duration: "5m"

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: borrowing-service-hpa
  namespace: default
  labels:
    app.kubernetes.io/part-of: lms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: borrowing-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

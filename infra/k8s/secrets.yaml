# IMPORTANT: Replace placeholder values below before applying.
# To create the secrets, run:
#   kubectl create secret generic db-credentials \
#     --from-literal=DB_PASSWORD=<your-password>
#   kubectl create secret generic jwt-secret \
#     --from-literal=JWT_SECRET_KEY=<your-long-random-secret>
#   kubectl create secret generic smtp-creds \
#     --from-literal=SMTP_USERNAME=<user> \
#     --from-literal=SMTP_PASSWORD=<pass>
#
# OR apply this file after base64-encoding your values:
#   echo -n 'value' | base64

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: default
  labels:
    app.kubernetes.io/part-of: lms
type: Opaque
data:
  DB_PASSWORD: bG1zX3Bhc3N3b3Jk   # lms_password (base64)

---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: default
  labels:
    app.kubernetes.io/part-of: lms
type: Opaque
data:
  JWT_SECRET_KEY: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=   # change-me-in-production (base64)

---
apiVersion: v1
kind: Secret
metadata:
  name: smtp-creds
  namespace: default
  labels:
    app.kubernetes.io/part-of: lms
type: Opaque
data:
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""

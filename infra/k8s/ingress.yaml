apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lms-ingress
  namespace: default
  labels:
    app.kubernetes.io/part-of: lms
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
spec:
  ingressClassName: nginx
  rules:
    - host: lms.local
      http:
        paths:
          - path: /api/books(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: book-catalog-svc
                port:
                  number: 5001
          - path: /api/users(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-svc
                port:
                  number: 5002
          - path: /auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-svc
                port:
                  number: 5002
          - path: /api/borrow(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: borrowing-svc
                port:
                  number: 5003
          - path: /api/notifications(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: notification-svc
                port:
                  number: 5004
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend-svc
                port:
                  number: 3000

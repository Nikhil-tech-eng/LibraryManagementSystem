apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: book-catalog-hpa
  namespace: default
  labels:
    app.kubernetes.io/part-of: lms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: book-catalog
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

apiVersion: apps/v1
kind: Deployment
metadata:
  name: borrowing-service
  namespace: default
  labels:
    app.kubernetes.io/name: borrowing-service
    app.kubernetes.io/part-of: lms
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: borrowing-service
  template:
    metadata:
      labels:
        app: borrowing-service
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5003"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: borrowing-service
          image: lms/borrowing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
          envFrom:
            - configMapRef:
                name: service-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "150m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: borrowing-svc
  namespace: default
  labels:
    app.kubernetes.io/name: borrowing-service
    app.kubernetes.io/part-of: lms
    tier: backend
spec:
  selector:
    app: borrowing-service
  ports:
    - port: 5003
      targetPort: 5003

apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-catalog
  namespace: default
  labels:
    app.kubernetes.io/name: book-catalog
    app.kubernetes.io/part-of: lms
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book-catalog
  template:
    metadata:
      labels:
        app: book-catalog
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: book-catalog
          image: lms/book-catalog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: service-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: book-catalog-svc
  namespace: default
  labels:
    app.kubernetes.io/name: book-catalog
    app.kubernetes.io/part-of: lms
    tier: backend
spec:
  selector:
    app: book-catalog
  ports:
    - port: 5001
      targetPort: 5001

name: LMS CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: nikhil-tech-eng/lms

jobs:
  # ─────────────────────────── Python Tests ────────────────────────────────
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [book-catalog, user-service, borrowing-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (${{ matrix.service }})
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt

      - name: Syntax-check Python files (${{ matrix.service }})
        run: |
          cd ${{ matrix.service }}
          python -m py_compile app/main.py app/database.py app/models.py

  # ─────────────────────────── Frontend Lint ───────────────────────────────
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

  # ─────────────────────────── Docker Build & Push ─────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-python, test-frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: book-catalog
            port: 5001
          - service: user-service
            port: 5002
          - service: borrowing-service
            port: 5003
          - service: notification-service
            port: 5004
          - service: frontend
            port: 3000
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true